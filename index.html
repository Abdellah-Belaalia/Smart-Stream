<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Smart Stream</title>
  </head>
  <body class="p-1 m-1">
    <header
      class="bg-gray-900 text-white px-6 py-4 flex items-center justify-between shadow-lg"
    >
      <div>
        <h1 class="text-2xl font-bold">Smart Stream</h1>
        <p class="text-gray-400 text-xs">Votre télivision</p>
      </div>
      <div class="text-sm text-gray-300">TV en direct</div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 h-full">
      <aside id="sidebar" class="col-span-4 bg-gray-600">
        <div class="flex items-center m-2 gap-4 px-2.5 py-3">
          <div class="relative">
            <button id="categorie-btn" class="bg-gray-200 p-2 rounded-lg">
              categories
            </button>

            <div
              id="categorie-bar"
              class="hidden absolute top-full left-0 mt-2 bg-white rounded-lg shadow-lg p-3 w-48 z-50"
            >
              <!-- <h3 class="font-bild mb-2">Categories</h3> -->

              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Toutes categories
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Sport
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Documentaires
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Films
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Dessins animés
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Actualités
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Musique
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Cuisine
              </div>
              <div class="categories-item p-2 rounded-lg hover:bg-gray-200">
                Religion
              </div>
            </div>
          </div>
          <div class="w-full">
            <input
              type="text"
              class="w-full bg-gray-200 p-2 border border-amber-50 rounded-lg"
              placeholder="Rechercher"
            />
          </div>
        </div>

        <div class="mt-2 mx-5 flex items-center justify-between">
          <h3 class="text-white font-bold text-3xl">Channels Television</h3>
          <span class="text-gray-300 text-xl">En direct</span>
        </div>
        <div class="m-4 h-screen overflow-y-auto">
          <div
            class="card-channels bg-gray-100 p-1 flex rounded-lg my-2 hover:-translate-y-1 transition duration-300 shadow-md hover:shadow-amber-50"
          >
            <img src="src/assets/2m.png" alt="" class="w-20 object-contain" />
            <div class="p-2">
              <h1 class="font-bold">2m</h1>
              <h2 class="text-xs">nationale</h2>
            </div>
          </div>
        </div>
      </aside>

      <section class="bg-blue-800 h-full col-span-8">
        <div id="categories" class="ml-8 my-4 flex gap-2">
          <h1>TV en direct</h1>
        </div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
