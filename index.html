<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Smart Stream</title>
  </head>
  <body class="m-0 h-screen flex flex-col overflow-hidden">
    <header
      class="bg-gray-900 text-white px-6 py-4 flex items-center justify-between shadow-lg"
    >
      <div>
        <h1 class="text-2xl font-bold">Smart Stream</h1>
        <p class="text-gray-400 text-xs">Votre télivision</p>
      </div>
      <div class="text-sm text-gray-300">TV en direct</div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 flex-1 min-h-0">
      <div id="hover-zone" class="fixed top-0 left-0 w-3 h-screen z-30"></div>
      <aside id="sidebar" class="col-span-4 bg-gray-600 min-h-0 flex flex-col overflow-hidden">
        <div class="flex items-center m-2 gap-4 px-2.5 py-3">
          <button id="categorie-btn" class="bg-gray-200 text-lg p-2 rounded-lg">
            Categories
          </button>
          <div
            id="background"
            class="hidden fixed inset-0 bg-black/40 z-40"
          ></div>

          <div
            id="categorie-bar"
            class="fixed top-0 -left-64 bg-white rounded-lg shadow-xl p-3 w-64 z-50 h-screen transition-all duration-300 ease-in-out"
          >
            <div
              class="flex flex-nowrap justify-between items-center mb-4 border-b pb-3"
            >
              <h2 class="text-xl font-bold">Catégories</h2>

              <button
                id="button-close"
                class="font-bold text-gray-500 hover:bg-red-500 hover:text-white w-10 h-10"
              >
                x
              </button>
            </div>

            <div id="categories-list">
              <!--categories will be appended here-->
            </div>
          </div>
          <div class="w-full">
            <input
              id="search-bar"
              type="text"
              class="w-full bg-gray-200 p-2 border border-amber-50 rounded-lg"
              placeholder="Rechercher"
            />
          </div>
        </div>

        <div class="mt-2 mx-5 flex items-center justify-between">
          <h3 class="text-white font-bold text-3xl">Channels Television</h3>
          <span class="text-gray-300 text-xl">En direct</span>
        </div>
        <div
          id="channels-card"
          class="m-4 min-h-0 overflow-y-auto scrollbar-thumb-gray-500"
        >
          <!--here's the cards place-->
        </div>
      </aside>

      <section class="bg-blue-950 min-h-0 col-span-8 p-6 flex flex-col overflow-y-auto">
        <div id="channel-header" class="flex items-center justify-between mb-4">
          <div>
            <h1 id="player-channel" class="text-white text-2xl font-bold">
              TV en direct
            </h1>
            <h2 id="channels-selected" class="text-white text-xl font-bold">
              Channel
            </h2>
            <p id="channel-number" class="text-blue-200 text-sm">Select Channel</p>
          </div>
          <div
            id="country-code"
            class="bg-blue-800 text-white px-3 py-2 rounded-lg font-bold"
          ></div>
        </div>

        <div
          id="play-case"
          class="bg-black w-full aspect-video rounded-lg overflow-hidden shrink-0"
        >
          <video id="player-video" class="h-full w-full" controls></video>
        </div>

        <div id="egp-zone" class="bg-blue-900 text-white mt-4 p-4 rounded-lg shrink-0">
          <h2 class="bg-white-200 font-black text-lg mb-3">
            Programme en cours
          </h2>

          <h3 id="epg-program" class="text-white"></h3>

          <div class="flex justify-between text-2xl text-white mt-3">
            <p id="epg-start"></p>
            <span id="epg-end"></span>
          </div>

          <div class="w-full bg-blue-950 rounded-full h-2 mt 2">
            <div id="epg-progress" class="bg-green-400 h-2 rounded-full" style="width: 0%;"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- <footer
      class="bg-gray-900 text-white px-6 py-4 flex items-center justify-between shadow-lg"
    >
      <div>
        <h1 class="text-2xl font-bold">Smart Stream</h1>
        <p class="text-gray-400 text-xs">Votre télivision</p>
      </div>
      <div class="text-sm text-gray-300">TV en direct</div>
    </footer> -->

    <script type="module" src="js/app.js"></script>
  </body>
</html>
